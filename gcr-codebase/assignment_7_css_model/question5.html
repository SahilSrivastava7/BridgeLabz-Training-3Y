<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="question5.css">
</head>
<body>
  <main>
    <h1>Advanced CSS Selectors</h1>
    <section class="selector-demo">
      <p class="intro">Explore attribute selectors, pseudo-classes, pseudo-elements and combinators.</p>
      <form>
        <input type="text" placeholder="Text input">
        <input type="email" placeholder="Email input">
      </form>
      <nav>
        <a href="https://example.com">Secure Link</a>
        <a href="https://developer.mozilla.org">MDN Link</a>
        <a href="/local-page">Local Link</a>
      </nav>
      <ul class="items">
        <li>First item <span>descendant span</span></li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
      </ul>
      <div class="parent">
        <p>Direct child paragraph</p>
        <p>Another sibling paragraph</p>
        <div><p>Nested descendant paragraph</p></div>
      </div>
    </section>
  </main>
</body>
</html>
