<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Photo Gallery</title><link rel="stylesheet" href="question8.css">
</head>
<body>
<header><h1>Responsive Photo Gallery</h1></header>
<main class="gallery">
  <figure><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain"><figcaption>Mountain</figcaption></figure>

  <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Forest"><figcaption>Forest</figcaption></figure>
  <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise"><figcaption>Sunrise</figcaption></figure>
  <figure><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80" alt="City"><figcaption>City</figcaption></figure>
  <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Landscape"><figcaption>Landscape</figcaption></figure>
</main>
<footer>Responsive CSS Grid Gallery</footer>
</body>
</html>
