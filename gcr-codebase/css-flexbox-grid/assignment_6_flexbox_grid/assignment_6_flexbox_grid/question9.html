<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flip Card</title><link rel="stylesheet" href="question9.css">
</head>
<body>
<main class="flip-page">
  <div class="flip-card">
    <div class="flip-inner">
      <article class="card-face front">
        <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80" alt="Modern workspace">
        <h1>Creative Studio</h1>
      </article>
      <article class="card-face back">
        <h1>About Us</h1>
        <p>We create responsive digital experiences with clean layouts, useful interactions and thoughtful design.</p>
      </article>
    </div>
  </div>
</main>
</body>
</html>
