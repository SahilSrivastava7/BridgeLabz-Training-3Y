<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Photo Gallery</title><link rel="stylesheet" href="question6.css">
</head>
<body>
<header><h1>Photo Gallery</h1><p>Hover over an image</p></header>
<main class="gallery">
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape"><figcaption>Mountain Escape</figcaption></div></figure>
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Beach"><figcaption>Ocean View</figcaption></div></figure>
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Forest"><figcaption>Quiet Forest</figcaption></div></figure>
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise"><figcaption>Morning Light</figcaption></div></figure>
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80" alt="City"><figcaption>City Life</figcaption></div></figure>
  <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Nature"><figcaption>Nature Trail</figcaption></div></figure>
</main>
<footer>CSS-only Photo Gallery</footer>
</body>
</html>
