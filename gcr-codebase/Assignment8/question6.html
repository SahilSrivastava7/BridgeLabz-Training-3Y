<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 6 - CSS Animation Demonstration</title>
  <link rel="stylesheet" href="question6.css" />
</head>
<body>
  <header>
    <h1>CSS Animation Demonstration</h1>
    <p>Three animated elements using @keyframes</p>
  </header>

  <main class="stage">
    <div class="animation-group">

      <div class="anim-item">
        <div class="moving-box"></div>
        <p class="caption">Moving Box &mdash; animation-direction: alternate</p>
      </div>

      <div class="anim-item">
        <div class="bouncing-ball"></div>
        <p class="caption">Bouncing Ball &mdash; animation-delay: 0.5s</p>
      </div>

      <div class="anim-item">
        <div class="color-text">Color Changing Text</div>
        <p class="caption">Color Text &mdash; animation-iteration-count: infinite</p>
      </div>

    </div>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 6</p>
  </footer>
</body>
</html>
