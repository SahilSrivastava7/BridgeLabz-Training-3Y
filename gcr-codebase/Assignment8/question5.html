<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 5 - Styled Button Collection</title>
  <link rel="stylesheet" href="question5.css" />
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
    <p>Primary, Secondary, Outline and Disabled buttons</p>
  </header>

  <main>
    <section class="button-row">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-outline">Outline</button>
      <button class="btn btn-primary" disabled>Disabled</button>
    </section>

    <p class="hint">Tab through the buttons to see the <code>:focus</code> outline, and click-and-hold to see the <code>:active</code> effect.</p>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 5</p>
  </footer>
</body>
</html>
