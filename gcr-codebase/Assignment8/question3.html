<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 3 - Image Showcase</title>
  <link rel="stylesheet" href="question3.css" />
</head>
<body>
  <header>
    <h1>Image Showcase Gallery</h1>
    <p>Hover over an image to see it scale and darken</p>
  </header>

  <main>
    <div class="gallery">

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/mountain/400/300" alt="A scenic mountain landscape" />
          <div class="overlay"></div>
        </div>
        <figcaption>Mountain View</figcaption>
      </figure>

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/forest/400/300" alt="A dense green forest" />
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/beach/400/300" alt="A sunny beach with waves" />
          <div class="overlay"></div>
        </div>
        <figcaption>Beach Sunset</figcaption>
      </figure>

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/city/400/300" alt="A city skyline at dusk" />
          <div class="overlay"></div>
        </div>
        <figcaption>City Skyline</figcaption>
      </figure>

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/desert/400/300" alt="A wide desert landscape" />
          <div class="overlay"></div>
        </div>
        <figcaption>Desert Dunes</figcaption>
      </figure>

      <figure class="img-card">
        <div class="img-wrap">
          <img src="https://picsum.photos/seed/lake/400/300" alt="A calm blue lake" />
          <div class="overlay"></div>
        </div>
        <figcaption>Quiet Lake</figcaption>
      </figure>

    </div>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 3</p>
  </footer>
</body>
</html>
