<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 2 - Tooltip Demonstration</title>
  <link rel="stylesheet" href="question2.css" />
</head>
<body>
  <header>
    <h1>CSS-Only Tooltip Demonstration</h1>
    <p>Hover over each item below to reveal its tooltip</p>
  </header>

  <main>
    <section class="tooltip-row">

      <span class="tooltip-item">
        Home
        <span class="tooltip-text">Go back to the homepage</span>
      </span>

      <span class="tooltip-item">
        ⭐ Favorite
        <span class="tooltip-text">Add this item to your favorites</span>
      </span>

      <span class="tooltip-item">
        ⚙ Settings
        <span class="tooltip-text">Open the settings panel</span>
      </span>

      <span class="tooltip-item">
        Help
        <span class="tooltip-text">Get help and support</span>
      </span>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 2</p>
  </footer>
</body>
</html>
