<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 10 - Complete Mini UI</title>
  <link rel="stylesheet" href="question10.css" />
</head>
<body>
  <header class="site-header">
    <h1>MiniApp</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="content-area">
    <article class="main-card">
      <img
        src="https://picsum.photos/seed/miniapp/100/100"
        alt="Profile avatar"
        class="card-image"
      />
      <h2>Create Your Account</h2>
      <p>Fill in the form below to get started with MiniApp.</p>

      <form class="signup-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Jane Doe" />

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="jane@example.com" />

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Sign Up</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 MiniApp &mdash; Assignment 8, Question 10</p>
  </footer>
</body>
</html>
